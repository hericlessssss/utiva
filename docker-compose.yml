services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: utiva
      POSTGRES_PASSWORD: utiva
      POSTGRES_DB: utiva
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - utiva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utiva']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://utiva:utiva@db:5432/utiva
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  utiva_pgdata:
