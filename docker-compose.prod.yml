# Compose de produção (Fase 6). A VPS usa Kamal: o container compartilhado `kamal-proxy`
# já ocupa 80/443 e faz o TLS de todas as apps. Por isso o Utiva NÃO sobe proxy próprio —
# o `app` entra na rede externa `kamal` e o deploy registra a rota no kamal-proxy
# (ver .github/workflows/deploy.yml). Diferente do docker-compose.yml (dev local):
#  - `app` vem de imagem pronta no GHCR (buildada no CI), não de `build: .`;
#  - `app` NÃO publica porta no host (quem expõe é o kamal-proxy, via rede `kamal`);
#  - `db` fica só na rede interna (`default`), inacessível de fora.
# O .env é escrito pelo deploy (GitHub Actions) a partir dos GitHub Secrets.
services:
  app:
    image: ghcr.io/hericlessssss/utiva:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Aplica as migrations antes de subir (volume limpo não tem as tabelas).
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://utiva:${POSTGRES_PASSWORD}@db:5432/utiva
      WEB_DIST: /app/web/dist
      # Estado persistente do runtime (cookie cf_clearance + cache de sprites) fora da imagem.
      CF_CLEARANCE_FILE: /data/.cf-clearance.json
      SPRITE_CACHE_DIR: /data/sprite-cache
    volumes:
      - utiva_appdata:/data
    networks:
      - default # fala com o db
      - kamal # o kamal-proxy alcança este container (utiva-app-1:3000)

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: utiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: utiva
    volumes:
      - utiva_pgdata:/var/lib/postgresql/data
    networks:
      - default # só interno; o Postgres não entra na rede do proxy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utiva']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
  kamal:
    external: true
    name: kamal

volumes:
  utiva_pgdata:
  utiva_appdata:
